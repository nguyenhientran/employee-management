<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm nhân viên</title>
</head>
<body>
<h1>Thêm nhân viên mới</h1>
<form th:action="@{/employees/add}" th:object="${employee}" method="post">
    <label>Tên: <input type="text" th:field="*{name}" /></label><br/>
    <label>Email: <input type="text" th:field="*{email}" /></label><br/>

    <label>Phòng ban:
        <select th:field="*{department}">
            <option th:each="d : ${departments}"
                    th:value="${d.id}"
                    th:text="${d.name}"></option>
        </select>
    </label><br/>

    <button type="submit">Lưu</button>
</form>
</body>
</html>
