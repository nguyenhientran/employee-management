<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tìm kiếm nhân viên</title>
</head>
<body>
<h1>Tìm kiếm nhân viên</h1>
<form th:action="@{/employees/search}" method="get">
    <input type="text" name="name" placeholder="Tìm theo tên" />
    <input type="text" name="department" placeholder="Tìm theo phòng ban" />
    <button type="submit">Tìm</button>
</form>

<table border="1" cellpadding="8">
    <tr><th>ID</th><th>Tên</th><th>Email</th><th>Phòng ban</th></tr>
    <tr th:each="emp : ${employees}">
        <td th:text="${emp.id}"></td>
        <td th:text="${emp.name}"></td>
        <td th:text="${emp.email}"></td>
        <td th:text="${emp.department != null ? emp.department.name : 'N/A'}"></td>
    </tr>
</table>
</body>
</html>
